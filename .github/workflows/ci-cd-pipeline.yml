# .github/workflows/ci-local.yml фыв

name: CI for Local Development

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

jobs:
  test_and_build:
    name: Test and Build Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install dependencies
        working-directory: ./task2_infra_docker/app
        run: npm ci

      - name: Run tests
        working-directory: ./task2_infra_docker/app
        run: npm test

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:latest ./task2_infra_docker/app

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:latest
