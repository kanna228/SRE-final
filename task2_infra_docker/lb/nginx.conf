# lb/nginx.conf (updated)
worker_processes 1;
events { worker_connections 1024; }

http {
  upstream todo_app {
    # DNS-имена сервисов из docker-compose
    server app1:8080;
    server app2:8080;
  }

  server {
    listen 80;

    # Сначала более специфичный маршрут /health
    location /health {
      proxy_pass http://todo_app/health;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Потом всё остальное
    location / {
      proxy_pass http://todo_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
